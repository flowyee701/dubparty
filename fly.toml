# Деплой на Fly.io — см. README, раздел «Деплой».
app = "dubparty"
primary_region = "ams"

[build]

[env]
  TRUST_PROXY = "true"
  LOG_LEVEL = "info"

# SQLite и файлы (клипы, озвучки) лежат на томе.
[mounts]
  source = "dubparty_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  # Комнаты живут в памяти процесса: машину нельзя усыплять и нельзя запускать вторую.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
